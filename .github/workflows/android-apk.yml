name: Android APK Build

on:
  push:
    branches: [ main ]
    paths:
      - 'upload-parts/**'
      - 'launcher-patches/**'
      - 'android-project/app/src/main/res/**'
      - '.github/workflows/android-apk.yml'
      - '.github/scripts/prepare_project.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Reconstruct Phase 5 project
        shell: bash
        run: |
          set -euo pipefail
          cat upload-parts/part01.b64 upload-parts/part02.b64 | base64 --decode > phase5.zip
          unzip -tq phase5.zip
          unzip -q phase5.zip -d android-project

      - name: Prepare verified source and toolchain
        run: python3 .github/scripts/prepare_project.py

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload prepared source for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sagarmatha-prepared-source
          path: android-project/
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sagarmatha-Launcher-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
