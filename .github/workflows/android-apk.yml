name: Android APK Build

on:
  push:
    branches: [ main ]
    paths:
      - 'Sagarmatha-Launcher-Phase5-Android-Studio-Project.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
      - name: Extract Android project
        run: |
          unzip -q Sagarmatha-Launcher-Phase5-Android-Studio-Project.zip -d android-project
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts
      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sagarmatha-Launcher-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
