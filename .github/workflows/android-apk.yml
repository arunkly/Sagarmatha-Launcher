name: Android APK Build

on:
  push:
    branches: [ main ]
    paths:
      - 'upload-parts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Reconstruct uploaded project archive
        run: |
          cat upload-parts/part01.b64 upload-parts/part02.b64 | base64 -d > Sagarmatha-Launcher-Phase5-Android-Studio-Project.zip
          unzip -tq Sagarmatha-Launcher-Phase5-Android-Studio-Project.zip
          unzip -q Sagarmatha-Launcher-Phase5-Android-Studio-Project.zip -d android-project
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts
          sed -i 's/compileSdk = 35/compileSdk = 36/' android-project/app/build.gradle.kts
          sed -i 's/2.0.21/2.3.0/' android-project/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-project/app/build.gradle.kts")
          s = p.read_text()
          old = '    kotlinOptions { jvmTarget = "17" }\n}'
          new = """}

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }"""
          if old not in s:
              raise SystemExit("Expected android/kotlinOptions block not found; refusing an unsafe edit")
          p.write_text(s.replace(old, new, 1))

          # Restore the original 2.6.2 artifact and its matching package API.
          app_gradle = Path("android-project/app/build.gradle.kts")
          gs = app_gradle.read_text()
          gs = gs.replace("io.github.shivathapaa:nepali-date-picker-android:2.6.2", "io.github.shivathapaa:nepali-date-picker:2.6.2")
          app_gradle.write_text(gs)

          # Correct EditText single-line calls and remove the invalid widget-host extra.
          import re
          main = Path("android-project/app/src/main/java/np/sagarmatha/launcher/MainActivity.kt")
          ms = main.read_text()
          ms = ms.replace("singleLine = true", "setSingleLine(true)")
          ms = re.sub(r"^\s*putExtra\(AppWidgetManager\.EXTRA_APPWIDGET_HOST_ID,\s*widgetHostId\)\s*\n", "", ms, flags=re.M)
          main.write_text(ms)

          # Use the original 2.6.2 public API for BS and AD date labels.
          service = Path("android-project/app/src/main/java/np/sagarmatha/launcher/NepaliCalendarService.kt")
          service.write_text("""package np.sagarmatha.launcher

import dev.shivathapaa.nepalidatepickerkmp.NepaliDateConverter
import dev.shivathapaa.nepalidatepickerkmp.NepaliDatePickerLang
import dev.shivathapaa.nepalidatepickerkmp.NameFormat

object NepaliCalendarService {
    fun todayEnglish(): String {
        val calendar = NepaliDateConverter.todayEnglishCalendar
        val weekday = NepaliDateConverter.getWeekdayName(calendar.dayOfWeek, NameFormat.FULL, NepaliDatePickerLang.ENGLISH)
        val month = NepaliDateConverter.getEnglishMonthName(calendar.month, NameFormat.FULL, NepaliDatePickerLang.ENGLISH)
        return "$weekday, $month \${calendar.dayOfMonth}, \${calendar.year}"
    }

    fun todayNepali(nepali: Boolean): String {
        val calendar = NepaliDateConverter.todayNepaliCalendar
        val language = if (nepali) NepaliDatePickerLang.NEPALI else NepaliDatePickerLang.ENGLISH
        val weekday = NepaliDateConverter.getWeekdayName(calendar.dayOfWeek, NameFormat.FULL, language)
        val month = NepaliDateConverter.getMonthName(calendar.month, NameFormat.FULL, language)
        val day = if (nepali) calendar.dayOfMonth.toNepaliDigits() else calendar.dayOfMonth.toString()
        val year = if (nepali) calendar.year.toNepaliDigits() else calendar.year.toString()
        return "$weekday, $month $day, $year"
    }

    private fun Int.toNepaliDigits(): String {
        val digits = "०१२३४५६७८९"
        return toString().map { ch -> if (ch in '0'..'9') digits[ch - '0'] else ch }.joinToString("")
    }
}
""")
          PY
      - name: Install Android SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sagarmatha-Launcher-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
